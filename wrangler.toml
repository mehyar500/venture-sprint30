# Sprint30 Pages project config.
# Deploys go through ~/workspace/sprint30/deploy.py (direct `wrangler pages
# deploy`; the Cloudflare GitHub App install is blocked by error 8000011).
# NEVER `wrangler pages deploy` from a directory with [vars] — see AGENTS.md.
# D1 + AI bindings are declared here AND attached at the Pages project level;
# this file documents the intended bindings.

name = "sprint30"
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "LEADS_DB"
database_name = "mehyar_leads_prod"
database_id = "e4f22065-e3e8-4772-87a8-51d4976be042"

[ai]
binding = "AI"
